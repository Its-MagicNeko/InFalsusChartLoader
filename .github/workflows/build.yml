name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 下载 if-spc-api C# 库
        uses: actions/download-artifact@v4
        with:
          name: if-spc-api-cs
          repository: Its-MagicNeko/if-spc-api
          run-id: 41079716931
          path: Managed
          github-token: ${{ secrets.IF_SPC_API }}

      - name: 检查 if-spc-api C# 库
        shell: cmd
        run: if not exist "Managed\if_spc_api_cs.dll" exit /b 1

      - name: 构建 MelonLoader Release
        shell: cmd
        run: call build.bat --MelonLoader Release

      - name: 构建 MelonLoader Debug
        shell: cmd
        run: call build.bat --MelonLoader Debug

      - name: 构建 BepInEx Release
        shell: cmd
        run: call build.bat --BepInEx Release

      - name: 构建 BepInEx Debug
        shell: cmd
        run: call build.bat --BepInEx Debug

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader-MelonLoader-Release
          path: bin/Release/InFalsusChartLoader.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader-MelonLoader-Debug
          path: bin/Debug/InFalsusChartLoader.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader-BepInEx-Release
          path: bin/BepInExRelease/InFalsusChartLoader.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader-BepInEx-Debug
          path: bin/BepInExDebug/InFalsusChartLoader.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: InFalsusChartLoader-*

      - run: |
          for d in InFalsusChartLoader-*/; do
            zip -rjq "${d%/}.zip" "$d"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
